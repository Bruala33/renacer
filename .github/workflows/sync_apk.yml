name: Auto-Build and Sync Android APK

on:
  push:
    branches:
      - version-estable
      - main
    paths:
      - 'app/static/**'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'sync_android_assets.py'
      - '.github/workflows/sync_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-apk-synced:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Check if APK already contains latest web and native assets
        id: check_apk
        run: |
          if [ -f "app/static/PianoCommunity.apk" ]; then
            ALL_WEB_MATCH=true
            for f in index.html game.js discover_home.js style.css whisper_worker.js sw.js; do
              unzip -p app/static/PianoCommunity.apk "assets/www/$f" > "/tmp/apk_$f" 2>/dev/null || true
              if ! cmp -s "/tmp/apk_$f" "app/static/$f"; then
                echo "Web asset differs inside APK: $f"
                ALL_WEB_MATCH=false
                break
              fi
            done
            APK_TS=$(git log -1 --format=%ct -- app/static/PianoCommunity.apk 2>/dev/null || echo 0)
            NATIVE_TS=$(git log -1 --format=%ct -- app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml app/build.gradle.kts 2>/dev/null || echo 0)
            if [ "$ALL_WEB_MATCH" = "true" ] && [ "${APK_TS:-0}" -ge "${NATIVE_TS:-0}" ]; then
              echo "APK is already 100% in sync with all web assets and native Kotlin/Gradle code"
              echo "needs_build=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "APK needs rebuild to match latest web/native files"
          echo "needs_build=true" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        if: steps.check_apk.outputs.needs_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: steps.check_apk.outputs.needs_build == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDK_MGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDK_MGR"
          yes | "$SDK_MGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDK_MGR" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        if: steps.check_apk.outputs.needs_build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build and Sign Updated APK
        if: steps.check_apk.outputs.needs_build == 'true'
        run: |
          python3 sync_android_assets.py
          gradle :app:assembleRelease --no-daemon
          python3 sync_android_assets.py
          ls -lh app/static/PianoCommunity.apk

      - name: Commit and Push Updated APK
        if: steps.check_apk.outputs.needs_build == 'true'
        run: |
          git config user.name "Renacer APK Sync Bot"
          git config user.email "actions@github.com"
          git checkout -- leaderboard.json app/static/leaderboard.json app/src/main/assets/www/leaderboard.json 2>/dev/null || true
          git rm -f --ignore-unmatch PianoCommunity.apk app/static/downloads/PianoCommunity.apk
          git add app/static/PianoCommunity.apk app/src/main/assets/www
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-sync PianoCommunity.apk with latest web version"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Sync GitHub Release Latest APK
        if: hashFiles('app/static/PianoCommunity.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_SIZE=$(stat -c%s app/static/PianoCommunity.apk)
          VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n1 | cut -d'"' -f2 || echo "latest")
          REMOTE_SIZE=$(curl -sIL "https://github.com/${{ github.repository }}/releases/latest/download/PianoCommunity.apk" | grep -i '^content-length:' | tail -n1 | awk '{print $2}' | tr -d '\r' || echo 0)
          echo "Local APK size: $LOCAL_SIZE | Latest Release APK size: ${REMOTE_SIZE:-0} | Version: $VERSION_NAME"
          if [ "${REMOTE_SIZE:-0}" != "$LOCAL_SIZE" ] || [ "${{ steps.check_apk.outputs.needs_build }}" = "true" ]; then
            if gh release view latest >/dev/null 2>&1; then
              gh release upload latest app/static/PianoCommunity.apk --clobber
              gh release edit latest --title "Piano Community v${VERSION_NAME}" --latest
            else
              gh release create latest app/static/PianoCommunity.apk \
                --title "Piano Community v${VERSION_NAME}" \
                --notes "APK oficial sincronizado automáticamente (v${VERSION_NAME})." \
                --latest
            fi
          else
            echo "GitHub Release latest already matches app/static/PianoCommunity.apk"
          fi
